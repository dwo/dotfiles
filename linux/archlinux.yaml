# Arch leaves systemd-resolved off, so without it every lookup reaches the
# network's DNS server uncached. NetworkManager hands the resolver its DNS
# servers once resolv.conf points at the stub.
- name: Local DNS cache
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: yes
    state: started

- name: DNS cache settings directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"

# systemd-resolved keeps bare hostnames like "raspberrypi" off the network's DNS
# server by default, unlike other resolvers, so home network names fail.
- name: Resolve bare hostnames through DNS
  ansible.builtin.copy:
    content: |
      [Resolve]
      ResolveUnicastSingleLabel=yes
    dest: /etc/systemd/resolved.conf.d/single-label.conf
    mode: "0644"
  register: resolved_single_label

- name: Restart the DNS cache for bare hostnames
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: resolved_single_label.changed

- name: Resolve through the local DNS cache
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: yes
  register: resolv_conf

- name: Restart NetworkManager for the DNS cache
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: restarted
  when: resolv_conf.changed

- name: multilib repository
  ansible.builtin.replace:
    path: /etc/pacman.conf
    regexp: '^#\[multilib\]\n#Include = /etc/pacman.d/mirrorlist'
    replace: "[multilib]\nInclude = /etc/pacman.d/mirrorlist"
  register: multilib

- name: Stock kernel boot image settings
  ansible.builtin.slurp:
    src: /etc/mkinitcpio.d/linux.preset
  register: linux_preset

# linux-lts is a fallback boot option.
- name: LTS kernel boot image settings
  ansible.builtin.copy:
    content: >-
      {{ linux_preset.content | b64decode
         | regex_replace("(?<=[-'])linux(?=[-.'\"])", 'linux-lts') }}
    dest: /etc/mkinitcpio.d/linux-lts.preset
    mode: "0644"

- name: Packages
  community.general.pacman:
    name: "{{ (package_lists | map('regex_replace', '#.*', '') | join(' ')).split() }}"
    update_cache: "{{ multilib.changed }}"
  vars:
    package_lists:
    - "{{ lookup('ansible.builtin.file', playbook_dir + '/pacman.txt') }}"
    - "{{ lookup('ansible.builtin.file', playbook_dir + '/pacman-desktop.txt') if display_manager.stat.exists else '' }}"
    - "{{ lookup('ansible.builtin.file', local_dir + '/pacman.txt', errors='ignore') or '' }}"

- name: Installed packages
  ansible.builtin.package_facts:

# nvidia-open only provides modules for the stock kernel.
- name: NVIDIA modules for the LTS kernel
  community.general.pacman:
    name: nvidia-open-lts
  when: "'nvidia-open' in ansible_facts.packages"

- name: AUR
  when: aur_packages | length > 0
  vars:
    aur_packages: "{{ (aur_package_lists | map('regex_replace', '#.*', '') | join(' ')).split() }}"
    aur_package_lists:
    - "{{ lookup('ansible.builtin.file', playbook_dir + '/aur-desktop.txt') if display_manager.stat.exists else '' }}"
    - "{{ lookup('ansible.builtin.file', local_dir + '/aur.txt', errors='ignore') or '' }}"
  block:
  - name: AUR build tools
    community.general.pacman:
      name: base-devel

  # AUR packages build as the user; makepkg and yay call sudo themselves for
  # the install step, reusing the authentication from this Ansible run.
  - name: yay
    become: no
    ansible.builtin.shell:
      cmd: |
        set -e
        dir=$(mktemp -d)
        git clone --depth 1 https://aur.archlinux.org/yay-bin.git "$dir"
        cd "$dir"
        makepkg -si --noconfirm
        rm -rf "$dir"
      creates: /usr/bin/yay

  # i3lock-color replaces i3lock, and yay cannot resolve the conflict
  # unattended.
  - name: i3lock replaced by i3lock-color
    community.general.pacman:
      name: i3lock
      state: absent
    when: "'i3lock-color' in aur_packages"

  - name: AUR packages
    become: no
    ansible.builtin.command:
      argv: "{{ ['yay', '-S', '--needed', '--noconfirm'] + aur_packages }}"
    register: aur
    changed_when: "'there is nothing to do' not in aur.stdout"

  # Papirus with folders recoloured to match the Catppuccin Mocha Lavender
  # login screen. The package's pacman hook reapplies the colour when Papirus
  # updates.
  - name: Catppuccin icons
    when: "'papirus-folders-catppuccin-git' in aur_packages"
    block:
    # papirus-folders -l can't report hyphenated colours like Catppuccin's as
    # current, so read the folder icon link it changes instead.
    - name: Icon folder colour
      ansible.builtin.stat:
        path: /usr/share/icons/Papirus/48x48/places/folder.svg
      register: folder_colour

    - name: Catppuccin icon folders
      ansible.builtin.command: papirus-folders -C cat-mocha-lavender --theme Papirus-Dark
      when: folder_colour.stat.lnk_target != 'folder-cat-mocha-lavender.svg'

    - name: Icon theme settings directories
      ansible.builtin.file:
        path: "/etc/{{ item }}"
        state: directory
        mode: "0755"
      loop: [gtk-3.0, gtk-4.0]

    # Without a GNOME settings daemon, GTK under X11 reads the icon theme from
    # settings.ini rather than dconf.
    - name: Icon theme
      community.general.ini_file:
        path: "/etc/{{ item }}/settings.ini"
        section: Settings
        option: gtk-icon-theme-name
        value: Papirus-Dark
        no_extra_spaces: yes
        mode: "0644"
      loop: [gtk-3.0, gtk-4.0]

# An animated boot splash, from plymouth-theme-abstract-ring-git in the AUR,
# that also draws the disk encryption password prompt.
- name: Boot splash
  when: "'plymouth' in ansible_facts.packages"
  block:
  - name: Boot splash theme
    community.general.ini_file:
      path: /etc/plymouth/plymouthd.conf
      section: Daemon
      option: Theme
      value: abstract_ring
      no_extra_spaces: yes
    register: plymouth_theme

  # It must come before encrypt to take over the password prompt.
  - name: Boot splash in the initramfs
    ansible.builtin.replace:
      path: /etc/mkinitcpio.conf
      regexp: '^(HOOKS=\((?!.*\bplymouth\b).*?)\b(sd-encrypt|encrypt|filesystems)\b'
      replace: '\1plymouth \2'
    register: plymouth_hook

  - name: Boot splash kernel parameters
    ansible.builtin.replace:
      path: /etc/kernel/cmdline
      regexp: '^(?!.*\b{{ item }}\b)(.+?)[ \t]*$'
      replace: '\1 {{ item }}'
    loop: [quiet, splash]
    register: plymouth_cmdline

  # Otherwise the boot loader shows a static logo before the animation starts.
  - name: No static splash in boot images
    ansible.builtin.replace:
      path: "/etc/mkinitcpio.d/{{ item }}.preset"
      regexp: ' ?--splash [^\s"]+'
      replace: ''
    loop: [linux, linux-lts]
    register: plymouth_presets

  - name: Rebuild boot images for the splash
    ansible.builtin.command: mkinitcpio -P
    when: plymouth_theme.changed or plymouth_hook.changed or plymouth_cmdline.changed or plymouth_presets.changed

  # The splash draws on the firmware framebuffer before GPU drivers load, which
  # firmware often leaves at a low resolution that then gets stretched.
  - name: Boot splash at native resolution
    ansible.builtin.lineinfile:
      path: /boot/loader/loader.conf
      regexp: '^#?console-mode\b'
      line: console-mode max

  # Boot goes straight to the splash; holding Space at power-on shows the menu
  # for the fallback kernel or firmware setup.
  - name: Boot menu hidden
    ansible.builtin.lineinfile:
      path: /boot/loader/loader.conf
      regexp: '^#?timeout\b'
      line: timeout 0

# systemd-boot doesn't detect the memory tester; hold Space at power-on to pick
# it from the boot menu.
- name: Memory test boot entry
  ansible.builtin.copy:
    content: |
      title Memtest86+
      efi /memtest86+/memtest86x64.efi
    dest: /boot/loader/entries/memtest.conf
    mode: "0644"
  when: "'memtest86+-efi' in ansible_facts.packages"

# SDDM with catppuccin-sddm-theme-mocha from the AUR. It's enabled but not
# started, because starting a display manager ends the running session.
- name: Login screen
  when: "'sddm' in ansible_facts.packages"
  block:
  - name: Login screen settings directory
    ansible.builtin.file:
      path: /etc/sddm.conf.d
      state: directory
      mode: "0755"

  - name: Login screen theme
    ansible.builtin.copy:
      content: |
        [Theme]
        Current=catppuccin-mocha-lavender
      dest: /etc/sddm.conf.d/theme.conf
      mode: "0644"

  # SDDM reads overrides from this file beside the packaged theme.conf; without
  # the background image the theme shows its plain base colour.
  - name: Login screen without background image
    ansible.builtin.copy:
      content: |
        [General]
        CustomBackground="false"
      dest: /usr/share/sddm/themes/catppuccin-mocha-lavender/theme.conf.user
      mode: "0644"

  - name: SDDM as the display manager
    ansible.builtin.systemd_service:
      name: sddm
      enabled: yes

# The default picks the most recently synced mirrors worldwide, regardless
# of distance; rank recent ones by download speed from this machine instead.
- name: Mirror selection
  ansible.builtin.copy:
    content: |
      --save /etc/pacman.d/mirrorlist
      --protocol https
      --latest 20
      --sort rate
      --number 5
    dest: /etc/xdg/reflector/reflector.conf
    mode: "0644"

- name: Maintenance timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
  - fwupd-refresh.timer
  - paccache.timer
  - reflector.timer

# On desktops the gcr agent can unlock keys from the login keyring, so the
# passphrase isn't needed again after each login. Only one agent should run.
- name: SSH agent
  become: no
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    scope: user
    enabled: "{{ item.enabled }}"
    state: "{{ 'started' if item.enabled else 'stopped' }}"
  loop:
  - name: ssh-agent.socket
    enabled: "{{ not display_manager.stat.exists }}"
  - name: gcr-ssh-agent.socket
    enabled: "{{ display_manager.stat.exists }}"

# Files lists network devices such as a NAS through Avahi. systemd-resolved
# also speaks mDNS, even when only resolving, and two mDNS stacks on one host
# conflict, so Avahi resolves .local names too, through nss-mdns.
- name: Network device discovery
  when: "'gvfs-dnssd' in ansible_facts.packages"
  block:
  - name: DNS cache without mDNS
    ansible.builtin.copy:
      content: |
        [Resolve]
        MulticastDNS=no
      dest: /etc/systemd/resolved.conf.d/mdns.conf
      mode: "0644"
    register: resolved_mdns

  - name: Resolve .local names through Avahi
    ansible.builtin.replace:
      path: /etc/nsswitch.conf
      regexp: '^(hosts:\s+mymachines)\s+(?!mdns_minimal)'
      replace: '\1 mdns_minimal [NOTFOUND=return] '

  - name: Restart the DNS cache for mDNS
    ansible.builtin.systemd_service:
      name: systemd-resolved
      state: restarted
    when: resolved_mdns.changed

  - name: Avahi
    ansible.builtin.systemd_service:
      name: avahi-daemon.service
      enabled: yes
      state: started
