# Share sudo authentication across terminals and terminal-less callers
# (editors, agents using SUDO_ASKPASS), which otherwise each prompt again.
- name: Sudo authentication shared across sessions
  ansible.builtin.copy:
    content: "Defaults:{{ user }} timestamp_type=global\n"
    dest: /etc/sudoers.d/10-timestamp-global
    mode: "0440"
    validate: visudo -cf %s

- name: Natural scrolling
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/30-natural-scrolling.conf"
    dest: /etc/X11/xorg.conf.d/30-natural-scrolling.conf
    mode: "0644"

- name: NVIDIA suspend services
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/nvidia-suspend.service
  register: nvidia_suspend

# Keep video memory across suspend and hibernate; without these the
# display can come back black or corrupted.
- name: Enable NVIDIA suspend services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: yes
  loop:
  - nvidia-hibernate.service
  - nvidia-resume.service
  - nvidia-suspend.service
  when: nvidia_suspend.stat.exists

# GTK apps, and Firefox through the desktop portal, pick dark styles from this
# setting. A system default applies without the user's D-Bus session, which
# Ansible may not have.
- name: Dark mode directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
  - /etc/dconf/db/local.d
  - /etc/dconf/profile

- name: Dark mode
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
  - dest: /etc/dconf/db/local.d/00-dark-mode
    content: |
      [org/gnome/desktop/interface]
      color-scheme='prefer-dark'
  - dest: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
  register: dconf_defaults

- name: Compile dconf defaults
  ansible.builtin.command: dconf update
  when: dconf_defaults.changed

# The packaged user service waits for a graphical session target that i3 never
# starts. The folders only need creating once.
- name: Standard home folders
  become: no
  ansible.builtin.command:
    cmd: xdg-user-dirs-update
    creates: ~/.config/user-dirs.dirs

# A system drop-in, because dunst only reads drop-ins next to the dunstrc it
# uses, and the packaged one lives in /etc.
- name: Notification drop-in directory
  ansible.builtin.file:
    path: /etc/dunst/dunstrc.d
    state: directory
    mode: "0755"

- name: Notifications held back in fullscreen
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/dunst-fullscreen.conf"
    dest: /etc/dunst/dunstrc.d/fullscreen.conf
    mode: "0644"
