[theme]
theme = "ctp-mocha"

[icons]
icons = "material-nf"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "temperature"
format = " $icon $max "
inputs = ["Tctl", "Package id 0"]

# The nvidia_gpu block reads 0° from drivers that report decimal
# temperatures, so query nvidia-smi directly.
[[block]]
block = "custom"
if_command = "command -v nvidia-smi"
command = "printf '%.0f' \"$(nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits)\""
interval = 5
format = " ^icon_gpu $text° "

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
warning = 20.0
alert = 10.0
format = " $icon $available.eng(w:2) "

[[block]]
block = "net"

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d %b %H:%M') "
