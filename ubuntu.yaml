- name: Ubuntu
  become: yes
  hosts: localhost
  connection: local
  vars_prompt:
  - name: "user"
    prompt: "Enter the username to configure"
    private: no

  tasks:
  - ansible.builtin.package_facts: manager=apt

  - name: Repository prerequisites
    ansible.builtin.apt:
      install_recommends: no
      update_cache: yes
      name:
      - ca-certificates
      - curl
      - gnupg

  - name: mise keyring directory
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

  - name: mise signing key
    ansible.builtin.get_url:
      url: https://mise.jdx.dev/gpg-key.pub
      dest: /etc/apt/keyrings/mise-archive-keyring.asc
      mode: "0644"
    register: mise_key

  - name: mise repository
    ansible.builtin.apt_repository:
      repo: "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.asc] https://mise.jdx.dev/deb stable main"
      filename: mise
      update_cache: no
    register: mise_repo

  - name: Repositories
    ansible.builtin.apt_repository:
      repo: "{{ item }}"
      update_cache: no
    register: repositories
    with_items:
    - ppa:neovim-ppa/unstable

  - name: Packages
    ansible.builtin.apt:
      install_recommends: no
      update_cache: "{{ mise_key.changed or mise_repo.changed or repositories.changed }}"
      name:
      - fish
      - graphviz
      - mise
      - neovim
      - python3-venv
      - screen
      - xclip

  - name: Configure Shell
    ansible.builtin.user:
      name: "{{ user }}"
      shell: /usr/bin/fish
      state: present

  - name: Install starship
    ansible.builtin.shell:
      creates: /usr/local/bin/starship
      cmd: curl -sS https://starship.rs/install.sh | sh -s -- -y
